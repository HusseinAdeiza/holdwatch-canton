canton-participant.conf
# Canton participant configuration for the local sandbox.
#
# Enables BOTH interfaces:
#   - gRPC Ledger API on 6865 (always on; used by `daml test`)
#   - HTTP/JSON Ledger API on 7575 (needed for the two-party create)
#
# The JSON Ledger API is what makes the multi-party flow expressible: a script
# harness cannot authorise a two-party create, but the HTTP API can, by sending
# actAs with both signatories.
#
# devMode disables authorisation so curl works without JWTs, which is what the
# official JSON Ledger API tutorial does.

canton {
  admin {
    port = 9060
  }

  participant {
    name = "local"
    storage = /tmp/canton-storage
    http-enabled = true
    port = 6865
    node-id = 122084768362d0ce21f1ffec870e55e365a292cdf8f54c5c38ad7775b9bdd462e141

    ledger-api {
      auth-jwt-enabled = false
      enabled = true
      port = 6865

      http {
        enabled = true
        port = 7575
        host = 127.0.0.1
      }
    }
  }
}
